name: Build Android APK

on:
  push:
    branches:
      - main # Agar aapki branch ka naam master hai to master likhein

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd Refer-zone-main
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor Android
        run: |
          cd Refer-zone-main
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK (Gradle)
        run: |
          cd Refer-zone-main/android && ./gradlew assembleDebug

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: ReferZone-APK
          path: Refer-zone-main/android/app/build/outputs/apk/debug/app-debug.apk
