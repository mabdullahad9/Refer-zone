<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Refer-Zone ($RZ) Ecosystem</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://renderer.adsgram.ai/js/renderer.js"></script>
    <!-- index.html ke <head> tag ke andar isko paste karein -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Monetag SDK Hook -->
<script src='//libtl.com/sdk.js' data-zone='11112958' data-sdk='show_11112958'></script>
    
    <style>
        :root {
            --neon-cyan: #00f0ff;
            --neon-gold: #f3ba2f;
            --bg-dark: #09080d;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.07);
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 50% 20%, #151221 0%, var(--bg-dark) 80%);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        #denied-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            background: #0a0a0c;
            padding: 20px;
        }
        .tg-btn {
            margin-top: 15px; padding: 12px 24px; background: #2481cc;
            color: white; text-decoration: none; border-radius: 8px; font-weight: bold;
            box-shadow: 0 0 15px rgba(36, 129, 204, 0.4);
        }

        #main-viewport {
            display: none;
            width: 100%;
            height: calc(100vh - 85px);
            box-sizing: border-box;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        .header-bar {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-tag { font-weight: 600; color: var(--neon-cyan); display: flex; align-items: center; gap: 6px; }
        .pph-tag { font-size: 13px; color: #a78bfa; background: rgba(167,139,250,0.1); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(167,139,250,0.15); }

        .balance-master {
            text-align: center;
            font-size: 44px;
            font-weight: 800;
            color: var(--neon-gold);
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(243, 186, 47, 0.3);
        }

        /* --- 🪙 HOME VIEW PROTOCOLS (Direct Embedded) --- */
        #built-in-home {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: viewFade 0.25s ease-out;
        }

        /* UPGRADED: Coin Node with Central Text Alignment Grid */
        #coin-interaction-node {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #ffd700 0%, #b8860b 100%);
            border-radius: 50%;
            margin: 30px 0;
            box-shadow: 0 0 30px rgba(243, 186, 47, 0.4), inset 0 0 20px rgba(255,255,255,0.6);
            cursor: pointer;
            transition: transform 0.05s ease;
            -webkit-tap-highlight-color: transparent;
            
            /* Built-in Center text logic */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
            font-weight: 900;
            color: #000000;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            font-family: 'Arial Black', Gadget, sans-serif;
            border: 4px solid #fff;
        }
        #coin-interaction-node:active { transform: scale(0.95); }

        .energy-wrapper {
            width: 80%;
            max-width: 300px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 4px;
            margin-top: 20px;
        }
        .energy-bar-fill {
            height: 12px;
            background: linear-gradient(90deg, #00f0ff, #00ff66);
            border-radius: 10px;
            width: 100%;
            transition: width 0.1s ease;
        }
        .energy-meta { font-size: 13px; color: #94a3b8; margin-top: 8px; font-weight: 600; }

        #tab-content-container {
            display: none;
            padding: 10px;
            animation: viewFade 0.25s ease-out;
        }

        @keyframes viewFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        /* --- 📱 NAVBAR BOTTOM FIXED PLATFORM --- */
        .bottom-navbar {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 24px);
            max-width: 400px;
            height: 72px;
            background: rgba(12, 10, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 9999;
            box-shadow: 0 8px 32px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.05);
        }

        .tab-trigger {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #4b5563;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            width: 55px;
            height: 100%;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .tab-trigger svg { width: 22px; height: 22px; fill: currentColor; margin-bottom: 4px; }
        .tab-trigger.active { color: var(--neon-cyan); filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.5)); }

        .tab-trigger-share {
            width: 76px; height: 76px; background: linear-gradient(135deg, #1d1836 0%, #0a0814 100%);
            border: 1px solid rgba(0, 240, 255, 0.4); border-radius: 50%; transform: translateY(-18px); color: #8ea1b4;
            box-shadow: 0 12px 28px rgba(0,0,0,0.6), 0 0 15px rgba(0, 240, 255, 0.1);
        }
        .tab-trigger-share svg { width: 26px; height: 26px; }
        .tab-trigger-share.active { color: var(--neon-gold); border-color: var(--neon-gold); filter: drop-shadow(0 0 10px rgba(243, 186, 47, 0.5)); }
    </style>
</head>
<body>

    <div id="denied-screen">
        <h2 style="color: #f44336; margin: 0; font-size: 24px;">Access Denied! ❌</h2>
        <p style="color: #94a3b8; font-size: 15px; margin-top: 10px;">Security Protocol Exception: Open via Telegram.</p>
        <a href="https://t.me/ReferZoneTap_bot" class="tg-btn">Launch Mini App</a>
    </div>

    <div id="main-viewport">
        <div class="header-bar">
            <div class="user-tag">👤 <span id="player-id">Loading...</span></div>
            <div class="pph-tag">🚀 +<span id="player-pph">0</span>/hr</div>
        </div>
        
        <div class="balance-master">
            💰 <span id="master-coin-counter">0</span>
        </div>
        
        <div id="built-in-home">
            <div id="coin-interaction-node">$RZ</div>
            
            <div class="energy-wrapper">
                <div class="energy-bar-fill" id="energy-fill-indicator"></div>
            </div>
            <div class="energy-meta">⚡ <span id="energy-current-val">6000</span> / 6000</div>
        </div>

        <div id="tab-content-container"></div>
    </div>

    <nav class="bottom-navbar" id="master-nav" style="display: none;">
        <div class="tab-trigger active" onclick="switchRoutingEngine('home', this)">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </div>
        <div class="tab-trigger" onclick="switchRoutingEngine('mine', this)">
            <svg viewBox="0 0 24 24"><path d="M12 2c-5.52 0-10 4.48-10 10s4.48 10 10 10 10-4.48 10-10-4.48-10-10-10zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/></svg>
            <span>Mine</span>
        </div>
        <div class="tab-trigger tab-trigger-share" onclick="switchRoutingEngine('share', this)">
            <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
            <span>Share</span>
        </div>
        <div class="tab-trigger" onclick="switchRoutingEngine('tasks', this)">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            <span>Tasks</span>
        </div>
        <div class="tab-trigger" onclick="switchRoutingEngine('wallet', this)">
            <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            <span>Wallet</span>
        </div>
    </nav>

    <script type="module" src="app.js"></script>
</body>
</html>
