<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Refer-Zone Tap Game</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* Base Styling (Dark Theme Like Hamster Kombat) */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #1d1c21 0%, #111015 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* Main Container - Pehle Hidden rahega jab tak Telegram Verify na ho */
        #game-container {
            text-align: center;
            display: none;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }
        
        /* User Info Greeting */
        .user-info {
            font-size: 18px;
            color: #2481cc;
            font-weight: 600;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        /* Coin Balance Display */
        .balance-container {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 30px;
            color: #f3ba2f;
            /* Premium Gold */
            text-shadow: 0 4px 10px rgba(243, 186, 47, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        /* Main Tapping Button */
        .coin-btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .coin-btn {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffe277 0%, #f3ba2f 70%, #c28e13 100%);
            border: 10px solid #ffd700;
            box-shadow: 0 15px 35px rgba(243, 186, 47, 0.4), inset 0 -8px 15px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            outline: none;
            transition: transform 0.05s ease, box-shadow 0.05s ease;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Tap Effect */
        .coin-btn:active {
            transform: scale(0.94);
            box-shadow: 0 8px 20px rgba(243, 186, 47, 0.6);
        }
        
        /* Footer Text */
        .footer-note {
            margin-top: 20px;
            font-size: 14px;
            color: #6e6d7a;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    
    <div id="game-container">
        <div class="user-info" id="welcome-msg">Loading Agent...</div>
        
        <div class="balance-container">
            💰 <span id="coin-balance">0</span>
        </div>
        
        <div class="coin-btn-container">
            <button class="coin-btn" id="tap-button"></button>
        </div>
        
        <div class="footer-note">REFER-ZONE ECOSYSTEM</div>
    </div>
    
    <script type="module" src="app.js"></script>
    
</body>

</html>
