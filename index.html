<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Refer-Zone ($RZ) Ecosystem</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <script type="text/javascript">var lck = false;</script>
    <script type="text/javascript" src="https://filestrue.com/script_include.php?id=1899372"></script>
    <script type="text/javascript">if(!lck){ console.log("Gripwall active or routing engine verification pending."); }</script>

    <style>
        :root {
            --neon-cyan: #00f0ff;
            --neon-gold: #f3ba2f;
            --bg-dark: #09080d;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.07);
            --primary-blue: #37447A;
            --light-blue: #8695D1;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 50% 20%, #151221 0%, var(--bg-dark) 70%);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Top Balance Stack */
        .balance-container {
            text-align: center;
            margin-top: 35px;
        }
        .balance-title {
            font-size: 13px;
            color: #94a3b8;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .balance-amount {
            font-size: 38px;
            font-weight: 800;
            color: var(--neon-gold);
            text-shadow: 0 0 20px rgba(243, 186, 47, 0.3);
            margin: 5px 0;
        }

        /* Pro Tap Coin 3D Matrix Container */
        .coin-master-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 48vh;
        }
        .coin-wrapper {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffeb94 0%, var(--neon-gold) 55%, #966b02 100%);
            border: 8px solid #ffd700;
            box-shadow: 0 0 40px rgba(243, 186, 47, 0.4), inset 0 4px 10px rgba(255,255,255,0.4), inset 0 -4px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.05s ease-in-out;
            position: relative;
        }
        /* Tap Pop Effect */
        .coin-active {
            transform: scale(0.93) rotate(-2deg) !important;
        }
        .coin-text-overlay {
            font-size: 68px;
            font-weight: 900;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        /* Floating Pro "+10 RZ" Text Dynamics */
        .floating-number {
            position: absolute;
            color: var(--neon-cyan);
            font-size: 24px;
            font-weight: 900;
            pointer-events: none;
            animation: floatUpAndFade 0.7s ease-out forwards;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6), 0 2px 4px rgba(0,0,0,0.8);
            z-index: 9999;
        }
        @keyframes floatUpAndFade {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.9); }
            100% { opacity: 0; transform: translate(-50%, -160%) scale(1.3); }
        }

        /* Pro SVG Bottom Navigation Dock */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            background: rgba(13, 11, 22, 0.92);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px) 0;
            border-top: 1px solid var(--glass-border);
            z-index: 5000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: #64748b;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
            margin-bottom: 5px;
            transition: transform 0.2s ease;
        }
        .nav-item:active svg {
            transform: scale(0.9);
        }
        .nav-item.active {
            color: var(--neon-cyan);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="balance-container">
        <div class="balance-title">Available Capital</div>
        <div class="balance-amount">🪙 <span id="user-balance">0</span> RZ</div>
    </div>

    <div class="coin-master-container">
        <div class="coin-wrapper" id="tap-coin">
            <span class="coin-text-overlay">⚡</span>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="home.html" class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>
        <a href="mine.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M22 2H2v20l4-4h16V2zm-2 14H6l-2 2V4h16v12zM7 9h2v2H7V9zm4 0h2v2h-2V9zm4 0h2v2h-2V9z"/></svg>
            <span>Mine</span>
        </a>
        <a href="tasks.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10H7v-2h10v2zm0-4H7V7h10v2zm0 8H7v-2h10v2z"/></svg>
            <span>Surveys</span>
        </a>
        <a href="share.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            <span>Invite</span>
        </a>
    </div>

    <script src="app.js"></script>
</body>
</html>
